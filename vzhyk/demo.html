<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">Vroomic. Логістична платформа</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="../theme.js"></script>
    <style>
        :root {
            --met-red: #E3000F;
            --met-dark: #1A1A1A;
            --met-light: #F8F9FA;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #2D3748;
            --text-muted: #718096;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #e8e4df;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            position: relative; overflow: hidden;
        }
        /* Background map (non-interactive) */
        #bgMap {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            filter: saturate(0.3) brightness(0.92);
        }
        #bgMap .leaflet-control-container { display: none; }

        .main-card {
            background: var(--glass-bg); padding: 50px 40px; border-radius: 20px;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border); max-width: 480px; width: 90%;
            transition: all 0.3s ease; position: relative; z-index: 1;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        .logo-title { font-size: 36px; font-weight: 800; color: var(--met-dark); margin-bottom: 5px; letter-spacing: -1px; }
        .logo-title span { color: var(--met-red); }
        .logo-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-bottom: 16px; }
        .btn-primary {
            background: var(--met-red); color: white; border: none; padding: 16px 24px;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(227, 0, 15, 0.3);
        }
        .btn-primary:hover { background: #C5000C; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(227, 0, 15, 0.4); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        .upload-btn-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }

        .btn-secondary {
            background: var(--met-dark); color: white; border: none; padding: 14px 24px;
            border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-secondary:hover { background: #333; }

        .btn-download {
            background: #059669; color: white; border: none; padding: 16px 24px;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
            margin-top: 10px;
        }
        .btn-download:hover { background: #047857; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4); }

        .btn-route {
            background: #0056B3; color: white; border: none; padding: 16px 24px;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 86, 179, 0.3);
            margin-top: 10px;
        }
        .btn-route:hover { background: #004494; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 86, 179, 0.4); }
        .btn-route:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        .api-key-input {
            width: 100%; padding: 14px 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px;
            font-size: 14px; color: var(--text-main); background: white; margin-bottom: 16px;
            transition: border-color 0.2s ease; outline: none;
        }
        .api-key-input:focus { border-color: var(--met-red); }
        .api-key-input::placeholder { color: var(--text-muted); }

        .input-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-align: left; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .file-name { font-size: 13px; color: var(--text-main); font-weight: 600; margin-top: -8px; margin-bottom: 12px; word-break: break-all; }

        .status-text { margin-top: 20px; font-size: 14px; color: var(--text-muted); min-height: 20px; }
        .status-text.error { color: var(--met-red); }
        .status-text.success { color: #059669; }

        .progress-container { width: 100%; background: rgba(0,0,0,0.06); border-radius: 10px; overflow: hidden; margin-top: 16px; height: 12px; display: none; }
        .progress-bar { height: 100%; background: var(--met-red); border-radius: 10px; transition: width 0.3s ease; width: 0%; }
        .progress-text { font-size: 13px; color: var(--text-main); font-weight: 600; margin-top: 10px; display: none; }

        .log-area {
            width: 100%; max-height: 160px; overflow-y: auto; background: rgba(0,0,0,0.04);
            border-radius: 10px; padding: 12px; margin-top: 12px; text-align: left;
            font-size: 11px; color: var(--text-muted); line-height: 1.6; display: none;
            font-family: 'Courier New', monospace;
        }
        .log-area::-webkit-scrollbar { width: 6px; }
        .log-area::-webkit-scrollbar-track { background: transparent; }
        .log-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stat-box { background: white; padding: 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.05); text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .stat-value { font-size: 20px; font-weight: 800; color: var(--met-red); margin-bottom: 4px; }
        .stat-label { font-size: 10px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; }

        .dict-status { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
        .dict-status.loaded { color: #059669; }
        .dict-status.error { color: var(--met-red); }

        .section { display: none; }
        .section.active { display: block; }

        /* Legacy lang-switch hidden — replaced by the shared topbar above */
        .legacy-lang-sw { display: none !important; }

        /* Shared topbar positioning override for centered-flex body */
        body > .topbar {
            position: fixed; top: 16px; left: 24px; right: 24px;
            margin: 0; z-index: 50;
        }
        body > .topbar .brand-title { color: var(--met-dark); }
        /* Map overlay covers topbar (z:1000 > 50) when active */

        /* --- Map overlay --- */
        .map-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            background: white;
        }
        .map-overlay.active { display: flex; }
        .map-sidebar {
            width: 340px; min-width: 340px; background: white; color: var(--text-main);
            display: flex; flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.08); overflow: hidden; z-index: 2;
        }
        .map-sidebar-header {
            padding: 18px 20px 14px; border-bottom: 1px solid #eee;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        }
        .map-sidebar-header .logo-title { color: var(--met-dark); font-size: 22px; flex: 1; }
        .btn-close-x {
            background: none; border: none; color: var(--text-muted); font-size: 13px;
            font-weight: 600; cursor: pointer; padding: 4px 8px; letter-spacing: 0.5px;
        }
        .btn-close-x:hover { color: var(--met-red); }
        .map-stats-bar {
            display: flex; gap: 10px; width: 100%; margin-top: 4px;
        }
        .map-stat {
            flex: 1; background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center;
        }
        .map-stat-value { font-size: 18px; font-weight: 800; color: var(--met-red); }
        .map-stat-label { font-size: 9px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; }
        .route-select-wrap { width: 100%; margin-top: 6px; }
        .route-select {
            width: 100%; padding: 9px 12px; background: #f8f9fa; color: var(--text-main);
            border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px;
            font-weight: 600; outline: none; cursor: pointer;
        }
        .route-select:focus { border-color: var(--met-red); }
        .map-sidebar-stops {
            flex: 1; overflow-y: auto; padding: 0;
        }
        .map-sidebar-stops::-webkit-scrollbar { width: 4px; }
        .map-sidebar-stops::-webkit-scrollbar-track { background: transparent; }
        .map-sidebar-stops::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 10px; }
        .stop-item {
            padding: 10px 18px; border-bottom: 1px solid #f1f5f9;
            cursor: pointer; transition: background 0.15s;
        }
        .stop-item:hover { background: #f8f9fa; }
        .stop-item.depot {
            background: #fef2f2; border-left: 3px solid var(--met-red);
        }
        .stop-num {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 50%; background: var(--met-red);
            color: white; font-size: 10px; font-weight: 700; margin-right: 10px; flex-shrink: 0;
        }
        .stop-num.depot-icon { background: var(--met-dark); font-size: 12px; }
        .stop-title { font-weight: 600; font-size: 12px; color: var(--text-main); }
        .stop-details { font-size: 10px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
        .stop-details span { color: var(--text-main); font-weight: 600; }
        #mapContainer { flex: 1; height: 100%; z-index: 1; }

        .btn-map {
            background: #2563EB; color: white; border: none; padding: 16px 24px;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(37,99,235,0.3);
            margin-top: 10px;
        }
        .btn-map:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
    </style>
</head>
<body data-page="live">
    <!-- Legacy lang switcher kept (hidden) so existing scripts don't break -->
    <div class="legacy-lang-sw" role="group" aria-label="Language" aria-hidden="true">
        <button type="button" data-lang="uk" class="active" onclick="setLang('uk')">UA</button>
        <button type="button" data-lang="en" onclick="setLang('en')">EN</button>
    </div>

    <!-- Shared site topbar -->
    <header class="topbar glass" id="siteTopbar">
        <a class="brand" href="../index.html" style="text-decoration:none;color:inherit;">
            <div class="brand-mark" aria-hidden="true">
                <span class="brand-dot"></span>
            </div>
            <div class="brand-text">
                <span class="brand-title">Metinvest Digital</span>
                <span class="brand-subtitle" data-i18n="topbar.subtitle">Демо рішень</span>
            </div>
        </a>
        <nav class="topnav">
            <a class="nav-btn active" href="../index.html" data-page-link="live">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0"/><path d="M2 12a10 10 0 0 1 20 0"/></svg>
                <span data-i18n="topbar.live">Наживо</span>
            </a>
            <a class="nav-btn" href="#" data-page-link="slides">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 18v3"/></svg>
                <span data-i18n="topbar.slides">Слайди</span>
            </a>
            <a class="nav-btn" href="../about.html" data-page-link="about">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
                <span data-i18n="topbar.about">Про Нас</span>
            </a>
        </nav>
        <div class="topright">
            <div class="lang-switch glass-inner" role="tablist" aria-label="Language">
                <button class="lang-btn active" data-lang="uk" role="tab" aria-selected="true" onclick="setLang('uk')">
                    <span class="flag flag-ua" aria-hidden="true"></span>UA
                </button>
                <button class="lang-btn" data-lang="en" role="tab" aria-selected="false" onclick="setLang('en')">
                    <span class="flag flag-gb" aria-hidden="true">
                        <svg viewBox="0 0 60 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="60" height="30" fill="#012169"/>
                            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
                            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3"/>
                            <rect x="25" width="10" height="30" fill="#fff"/>
                            <rect y="11" width="60" height="8" fill="#fff"/>
                            <rect x="27" width="6" height="30" fill="#C8102E"/>
                            <rect y="13" width="60" height="4" fill="#C8102E"/>
                        </svg>
                    </span>EN
                </button>
            </div>
        </div>
    </header>

    <div class="main-card">
        <div class="logo-title">Vroomic<span>.</span></div>
        <div class="logo-subtitle" data-i18n="subtitle">Логістична платформа</div>

        <!-- Hidden elements (kept so existing scripts don't break) -->
        <div id="dictStatus" class="dict-status" style="display:none;"></div>
        <div id="dictFallback" style="display:none;">
            <input type="file" id="dictFileInput" accept=".xlsx,.xls" />
        </div>
        <input type="password" id="apiKeyInput" style="display:none;" />
        <button id="btnStart" style="display:none;"></button>
        <button id="btnStartRoutes" style="display:none;"></button>

        <!-- SECTION: Upload -->
        <div id="sectionUpload" class="section active">
            <div class="upload-btn-wrapper">
                <button class="btn-primary" data-i18n="upload_orders">ЗАВАНТАЖИТИ ФАЙЛ ЗАМОВЛЕНЬ</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
            </div>
            <div id="fileName" class="file-name" style="display:none;"></div>

            <button id="btnDemoStart" class="btn-route" disabled onclick="startDemoProcessing()" data-i18n="plan_routes">ПЛАНУВАТИ МАРШРУТИ</button>

            <div id="uploadStatus" class="status-text" data-i18n="upload_hint">Завантажте XLSX файл із замовленнями</div>

            <!-- Hidden helpers (kept so existing scripts don't break) -->
            <div id="cacheLoadHint" style="display:none;"></div>
            <div id="cacheFallback" style="display:none;">
                <input type="file" id="cacheFileInput" accept=".json,application/json" />
            </div>
            <input type="password" id="devApiKeyInput" style="display:none;" />
            <button id="btnGenerateCache" style="display:none;" onclick="generateCachedResponse()"></button>

            <div style="margin-top: 18px;">
                <a href="Замовлення.xlsx" download style="font-size: 12px; color: var(--text-muted); text-decoration: underline;" data-i18n="download_demo_data">Завантажити Демо дані</a>
            </div>
        </div>

        <!-- SECTION: Processing -->
        <div id="sectionProcessing" class="section">
            <div class="progress-text" id="progressText" style="display:block;"></div>
            <div class="progress-container" id="progressContainer" style="display:block;">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="log-area" id="logArea" style="display:block;"></div>
            <div id="processingStatus" class="status-text"></div>
        </div>

        <!-- SECTION: Geocoding Result (used in dev mode only) -->
        <div id="sectionResult" class="section">
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-value" id="statSuccess">0</div>
                    <div class="stat-label" data-i18n="stat_geocoded">Геокодовано</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label" data-i18n="stat_total_orders">Всього замовлень</div>
                </div>
            </div>
            <div id="resultStatus" class="status-text success" style="margin-top: 16px;"></div>
            <button class="btn-secondary" onclick="resetApp()" data-i18n="start_over">ПОЧАТИ ЗНОВУ</button>
        </div>

        <!-- SECTION: Route Processing -->
        <div id="sectionRouteProcessing" class="section">
            <div class="progress-text" id="routeProgressText" style="display:block;"></div>
            <div class="progress-container" id="routeProgressContainer" style="display:block;">
                <div class="progress-bar" id="routeProgressBar"></div>
            </div>
            <div id="routeProcessingStatus" class="status-text"></div>
        </div>

        <!-- SECTION: Route Result -->
        <div id="sectionRouteResult" class="section">
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-value" id="statRoutes">0</div>
                    <div class="stat-label" data-i18n="stat_routes">Маршрутів</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statUnassigned">0</div>
                    <div class="stat-label" data-i18n="stat_unassigned">Не розподілено</div>
                </div>
            </div>
            <div id="routeResultStatus" class="status-text success" style="margin-top: 16px;"></div>
            <button class="btn-download" onclick="downloadRoutes()" data-i18n="download_routes_xlsx">ЗАВАНТАЖИТИ МАРШРУТИ (.XLSX)</button>
            <button class="btn-map" onclick="showMapView()" data-i18n="show_on_map">ПОКАЗАТИ НА КАРТІ</button>
            <button class="btn-secondary" onclick="resetApp()" data-i18n="start_over">ПОЧАТИ ЗНОВУ</button>
        </div>
    </div>

    <!-- Background map -->
    <div id="bgMap"></div>

    <!-- MAP OVERLAY -->
    <div id="mapOverlay" class="map-overlay">
        <div class="map-sidebar">
            <div class="map-sidebar-header">
                <div class="logo-title">Vroomic<span>.</span></div>
                <button class="btn-close-x" onclick="closeMapView()" data-i18n="close_x">✕ ЗАКРИТИ</button>
                <div class="map-stats-bar">
                    <div class="map-stat">
                        <div class="map-stat-value" id="mapStatKm">0</div>
                        <div class="map-stat-label" data-i18n="stat_distance">Дистанція</div>
                    </div>
                    <div class="map-stat">
                        <div class="map-stat-value" id="mapStatStops">0</div>
                        <div class="map-stat-label" data-i18n="stat_stops">Точок</div>
                    </div>
                </div>
                <div class="route-select-wrap">
                    <select id="routeSelector" class="route-select" onchange="onRouteSelect()">
                        <option value="all" data-i18n="all_routes">Всі маршрути</option>
                    </select>
                </div>
            </div>
            <div class="map-sidebar-stops" id="stopsList"></div>
        </div>
        <div id="mapContainer"></div>
    </div>

                dict_loaded: (n) => `Довідник завантажено: ${n} адрес з координатами`,

        // --- Utility functions ---
        function normText(x) {
            if (x === null || x === undefined || x === '') return '';
            let s = String(x).trim();
            s = s.replace(/\s+/g, ' ');
            s = s.replace(/,+$/, '');
            return s;
        }

        function makeKey(country, postalCode, city, street) {
            return [normText(country), normText(postalCode), normText(city), normText(street)]
                .map(s => s.toLowerCase()).join('|');
        }

        function getPostalCode(row) {
            if (row[COL_POSTAL_1] !== undefined && row[COL_POSTAL_1] !== null && row[COL_POSTAL_1] !== '') {
                return row[COL_POSTAL_1];
            }
            return row[COL_POSTAL_2] || '';
        }

        function buildQ(row) {
            const street = normText(row[COL_STREET]);
            const city = normText(row[COL_CITY]);
            const country = normText(row[COL_COUNTRY]);
            const postal = normText(getPostalCode(row));
            const cityPart = (postal + ' ' + city).trim();
            return [street, cityPart, country].filter(Boolean).join(', ');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getOrderRows() {
            if (!ordersData) return [];
            return ordersData.filter(row => {
                const v = normText(row[COL_ORDER_NUM]);
                return v !== '';
            });
        }

        // --- Load addresses.xlsx dictionary ---
        function parseDictionary(arrayBuffer) {
            const statusEl = document.getElementById('dictStatus');
            const wb = XLSX.read(arrayBuffer, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(ws, { defval: '' });

            let count = 0;
            for (const row of data) {
                const lon = parseFloat(row.lon);
                const lat = parseFloat(row.lat);
                const status = normText(row.status).toUpperCase();
                if (status.startsWith('OK') && !isNaN(lon) && !isNaN(lat)) {
                    const key = makeKey(row.country, row.postal_code, row.city, row.street);
                    addressDict[key] = { lon, lat };
                    count++;
                }
            }

            dictLoaded = true;
            dictAddressCount = count;
            dictFallbackVisible = false;
            statusEl.textContent = t('dict_loaded', count);
            statusEl.className = 'dict-status loaded';
            document.getElementById('dictFallback').style.display = 'none';
        }

        function showDictFallback() {
            const statusEl = document.getElementById('dictStatus');
            dictLoaded = true;
            dictFallbackVisible = true;
            statusEl.textContent = t('dict_manual');
            statusEl.className = 'dict-status';
            document.getElementById('dictFallback').style.display = 'block';
        }

        async function loadDictionary() {
            // 1. Try fetch (works on web servers / GitHub Pages)
            try {
                const response = await fetch('./addresses.xlsx');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const arrayBuffer = await response.arrayBuffer();
                parseDictionary(arrayBuffer);
                return;
            } catch (e) { /* fetch failed, try XHR */ }

            // 2. Try XMLHttpRequest (sometimes works with file://)
            try {
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('GET', './addresses.xlsx', true);
                    xhr.responseType = 'arraybuffer';
                    xhr.onload = () => {
                        if (xhr.status === 0 || xhr.status === 200) resolve(xhr.response);
                        else reject(new Error('XHR ' + xhr.status));
                    };
                    xhr.onerror = () => reject(new Error('XHR failed'));
                    xhr.send();
                });
                if (arrayBuffer && arrayBuffer.byteLength > 0) {
                    parseDictionary(arrayBuffer);
                    return;
                }
            } catch (e) { /* XHR also failed */ }

            // 3. Fallback: show file picker
            showDictFallback();
        }

        // --- Geocoding API calls ---
        async function nominatimStructured(country, postalCode, city, street) {
            const params = new URLSearchParams({
                format: 'jsonv2', limit: '1',
                street: normText(street), city: normText(city),
                country: normText(country), postalcode: normText(postalCode)
            });
            try {
                const r = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString(), {
                    headers: { 'User-Agent': 'Vroomic-Geocoder/1.0' }
                });
                if (!r.ok) return { lon: null, lat: null, status: 'HTTP_' + r.status };
                const data = await r.json();
                if (!data || data.length === 0) return { lon: null, lat: null, status: 'NOT_FOUND' };
                const lon = parseFloat(data[0].lon);
                const lat = parseFloat(data[0].lat);
                if (isNaN(lon) || isNaN(lat)) return { lon: null, lat: null, status: 'NOT_FOUND' };
                return { lon, lat, status: 'OK' };
            } catch (e) {
                return { lon: null, lat: null, status: 'ERROR' };
            }
        }

        async function nominatimQuery(q) {
            const params = new URLSearchParams({ format: 'jsonv2', limit: '1', q: q });
            try {
                const r = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString(), {
                    headers: { 'User-Agent': 'Vroomic-Geocoder/1.0' }
                });
                if (!r.ok) return { lon: null, lat: null, status: 'HTTP_' + r.status };
                const data = await r.json();
                if (!data || data.length === 0) return { lon: null, lat: null, status: 'NOT_FOUND' };
                const lon = parseFloat(data[0].lon);
                const lat = parseFloat(data[0].lat);
                if (isNaN(lon) || isNaN(lat)) return { lon: null, lat: null, status: 'NOT_FOUND' };
                return { lon, lat, status: 'OK_Q' };
            } catch (e) {
                return { lon: null, lat: null, status: 'ERROR' };
            }
        }

        async function googleGeocode(address, apiKey) {
            const params = new URLSearchParams({ address, key: apiKey });
            try {
                const r = await fetch('https://maps.googleapis.com/maps/api/geocode/json?' + params.toString());
                if (!r.ok) return { lon: null, lat: null, status: 'HTTP_' + r.status };
                const data = await r.json();
                if (data.status !== 'OK') return { lon: null, lat: null, status: 'GOOGLE_' + data.status };
                const results = data.results || [];
                if (results.length === 0) return { lon: null, lat: null, status: 'GOOGLE_ZERO_RESULTS' };
                const loc = results[0].geometry?.location;
                if (!loc || loc.lat == null || loc.lng == null) return { lon: null, lat: null, status: 'GOOGLE_BAD_RESPONSE' };
                return { lon: loc.lng, lat: loc.lat, status: 'OK_GOOGLE' };
            } catch (e) {
                return { lon: null, lat: null, status: 'ERROR' };
            }
        }

        // --- Log helper ---
        function addLog(text) {
            const logArea = document.getElementById('logArea');
            logArea.textContent += text + '\n';
            logArea.scrollTop = logArea.scrollHeight;
        }

        // --- Main geocoding process ---
        async function startGeocoding() {
            if (!ordersData || ordersData.length === 0) return;

            abortProcessing = false;
            showSection('sectionProcessing');

            const googleKey = document.getElementById('apiKeyInput').value.trim();
            const orderRows = getOrderRows();
            const total = orderRows.length;
            let successCount = 0;
            let lastNomCall = 0;

            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const logArea = document.getElementById('logArea');
            logArea.textContent = '';

            async function nomWait() {
                const now = Date.now();
                const wait = (lastNomCall + 1100) - now;
                if (wait > 0) await sleep(wait);
                lastNomCall = Date.now();
            }

            for (let i = 0; i < ordersData.length; i++) {
                if (abortProcessing) break;

                const row = ordersData[i];
                const orderNum = normText(row[COL_ORDER_NUM]);

                // Skip rows without order number
                if (orderNum === '') {
                    row.lon = '';
                    row.lat = '';
                    continue;
                }

                const country = normText(row[COL_COUNTRY]);
                const postal = normText(getPostalCode(row));
                const city = normText(row[COL_CITY]);
                const street = normText(row[COL_STREET]);
                const key = makeKey(country, postal, city, street);
                const addressStr = buildQ(row);

                const currentOrderIdx = ordersData.slice(0, i + 1).filter(r => normText(r[COL_ORDER_NUM]) !== '').length;
                const pct = Math.round((currentOrderIdx / total) * 100);
                progressBar.style.width = pct + '%';
                progressText.textContent = t('processing_row', currentOrderIdx, total);

                // 1. Dictionary lookup
                if (addressDict[key]) {
                    row.lon = addressDict[key].lon;
                    row.lat = addressDict[key].lat;
                    successCount++;
                    addLog(`[${currentOrderIdx}/${total}] (DICT) ${addressStr} -> ${row.lon},${row.lat}`);
                    continue;
                }

                // 2. Nominatim structured
                let path = [];
                let lon = null, lat = null, finalStatus = null;

                await nomWait();
                const s1 = await nominatimStructured(country, postal, city, street);
                path.push('STRUCT');

                if (s1.status === 'OK') {
                    lon = s1.lon; lat = s1.lat; finalStatus = 'OK';
                } else if (s1.status.startsWith('HTTP_')) {
                    finalStatus = s1.status;
                } else {
                    // 3. Nominatim free-text
                    await nomWait();
                    const s2 = await nominatimQuery(addressStr);
                    path.push('Q');

                    if (s2.status === 'OK_Q') {
                        lon = s2.lon; lat = s2.lat; finalStatus = 'OK_Q';
                    } else if (s2.status.startsWith('HTTP_')) {
                        finalStatus = s2.status;
                    } else {
                        finalStatus = 'NOT_FOUND';
                    }
                }

                // 4. Google fallback
                if (finalStatus === 'NOT_FOUND' && googleKey && addressStr) {
                    const s3 = await googleGeocode(addressStr, googleKey);
                    path.push('GOOGLE');
                    if (s3.status === 'OK_GOOGLE') {
                        lon = s3.lon; lat = s3.lat; finalStatus = 'OK_GOOGLE';
                    } else {
                        finalStatus = s3.status.startsWith('GOOGLE_') ? s3.status : 'NOT_FOUND';
                    }
                }

                if (lon !== null && lat !== null) {
                    row.lon = lon;
                    row.lat = lat;
                    successCount++;
                    addressDict[key] = { lon, lat };
                } else {
                    row.lon = '';
                    row.lat = '';
                }

                addLog(`[${currentOrderIdx}/${total}] (${path.join('->')}) ${addressStr} -> ${lon || ''},${lat || ''} status=${finalStatus}`);
            }

            buildResult(successCount, total);
        }

        // --- Route Generation (Ядро планувальника) ---
        async function startRouteGeneration() {
            document.getElementById('dictStatus').style.display = 'none';
            document.getElementById('dictFallback').style.display = 'none';
            showSection('sectionRouteProcessing');

            const progressBar = document.getElementById('routeProgressBar');
            const progressText = document.getElementById('routeProgressText');
            const statusEl = document.getElementById('routeProcessingStatus');

            progressText.textContent = t('grouping_points');
            progressBar.style.width = '5%';

            const orderRows = getOrderRows();
            const pointsMap = new Map(); // key: "lon|lat" -> { totalVolume, orders: [] }
            const individualJobOrderMap = {}; // id -> order data (for final Excel)

            // 1. Group orders by coordinates
            let orderCounter = 1;
            for (const row of orderRows) {
                const lon = parseFloat(row.lon);
                const lat = parseFloat(row.lat);
                if (isNaN(lon) || isNaN(lat)) continue;

                const coordKey = `${lon}|${lat}`;
                if (!pointsMap.has(coordKey)) {
                    pointsMap.set(coordKey, { lon, lat, totalVolume: 0, orders: [] });
                }

                const point = pointsMap.get(coordKey);
                const volume = parseFloat(row[COL_VOLUME]) || 0;

                const orderData = {
                    orderNum: normText(row[COL_ORDER_NUM]),
                    product: normText(row[COL_PRODUCT]),
                    volume,
                    country: normText(row[COL_COUNTRY]),
                    postal: normText(getPostalCode(row)),
                    city: normText(row[COL_CITY]),
                    street: normText(row[COL_STREET]),
                    lon, lat
                };

                const currentOrderId = orderCounter++;
                individualJobOrderMap[currentOrderId] = orderData;

                point.orders.push({ id: currentOrderId, volume });
                point.totalVolume += volume;
            }

            // 2. Build jobs (one per unique point)
            const jobs = [];
            const pointToOrdersMap = {};
            let pointId = 1;

            pointsMap.forEach((data) => {
                jobs.push({
                    id: pointId,
                    location: [data.lon, data.lat],
                    amount: [Math.ceil(data.totalVolume * 100)]
                });
                pointToOrdersMap[pointId] = data.orders;
                pointId++;
            });

            if (jobs.length === 0) {
                statusEl.textContent = t('no_coords');
                statusEl.className = 'status-text error';
                return;
            }

            // 3. Build vehicles with a 20-unique-points limit per truck
            const vehicles = [];
            let vehicleId = 1;
            const caps = [80, 35];
            for (const cap of caps) {
                for (let i = 0; i < 50; i++) {
                    vehicles.push({
                        id: vehicleId++,
                        description: t('truck', cap, i + 1),
                        start: [DEPOT_LON, DEPOT_LAT],
                        capacity: [cap * 100],
                        max_tasks: 20
                    });
                }
            }

            try {
                progressBar.style.width = '40%';
                progressText.textContent = t('optimizing_max20');

                const response = await fetch(PLANNER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vehicles, jobs, options: { g: true } })
                });

                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (data.code !== 0) throw new Error(data.error || t('planner_code_err', data.code));

                // 4. Expand grouped point steps back into individual order steps
                if (data.routes) {
                    data.routes.forEach(route => {
                        const expandedSteps = [];
                        route.steps.forEach(step => {
                            if (step.type === 'job') {
                                const ordersAtThisPoint = pointToOrdersMap[step.id] || [];
                                ordersAtThisPoint.forEach(orderInfo => {
                                    expandedSteps.push({
                                        ...step,
                                        id: orderInfo.id,
                                        job: orderInfo.id
                                    });
                                });
                            } else {
                                expandedSteps.push(step);
                            }
                        });
                        route.steps = expandedSteps;
                    });
                }

                progressText.textContent = t('finalizing');
                progressBar.style.width = '95%';

                buildRoutesResult(data, individualJobOrderMap);

            } catch (err) {
                statusEl.textContent = t('planner_err', err.message);
                statusEl.className = 'status-text error';
                progressBar.style.width = '100%';
            }
        }

        function buildRoutesResult(vroomData, jobOrderMap) {
            const routes = vroomData.routes || [];
            const unassigned = vroomData.unassigned || [];

            // Build map data structure
            mapRoutesData = [];
            let mapRouteNum = 1;
            for (const route of routes) {
                const jobSteps = route.steps.filter(s => s.type === 'job');
                if (jobSteps.length === 0) continue;
                const routeLabel = 'FF-' + String(mapRouteNum).padStart(3, '0');
                // Get vehicle capacity from description
                const capMatch = (route.description || '').match(/(\d+)(?:м³|m³)/);
                const truckCapacity = capMatch ? parseFloat(capMatch[1]) : 0;
                let remaining = truckCapacity;
                const stops = [];
                for (let si = 0; si < jobSteps.length; si++) {
                    const step = jobSteps[si];
                    const info = jobOrderMap[step.id] || jobOrderMap[step.job] || {};
                    const vol = info.volume || 0;
                    remaining -= vol;
                    const distKm = step.distance !== undefined ? (step.distance / 1000) + 14 : 14;
                    stops.push({
                        seq: si + 1, orderNum: info.orderNum || '', product: info.product || '',
                        volume: vol, remaining: Math.max(0, Math.round(remaining * 100) / 100),
                        distKm: Math.round(distKm * 10) / 10,
                        country: info.country || '', postal: info.postal || '',
                        city: info.city || '', street: info.street || '',
                        lon: info.lon, lat: info.lat
                    });
                }
                mapRoutesData.push({ label: routeLabel, truckCapacity, stops, geometry: route.geometry || null });
                mapRouteNum++;
            }

            // Sheet 1: Detailed routes (with address columns)
            const sheet1Headers = [te('hdr_route_num'), te('hdr_seq'), te('hdr_order'), te('hdr_product'), te('hdr_volume'), te('hdr_country'), te('hdr_postal'), te('hdr_city'), te('hdr_street'), te('hdr_mileage')];
            const sheet1Data = [sheet1Headers];

            // Sheet 2: Route summary (without truck column, with country)
            const sheet2Headers = [te('hdr_route_num'), te('hdr_actual_vol'), te('hdr_country'), te('hdr_points_count'), te('hdr_mileage_short')];
            const sheet2Data = [sheet2Headers];

            let routeNumber = 1;
            let grandTotalKm = 0;
            let isFirstRoute = true;

            for (const route of routes) {
                // Only include routes that have job steps
                const jobSteps = route.steps.filter(s => s.type === 'job');
                if (jobSteps.length === 0) continue;

                // Add 2 empty rows between routes (not before the first one)
                if (!isFirstRoute) {
                    sheet1Data.push(['', '', '', '', '', '', '', '', '', '']);
                    sheet1Data.push(['', '', '', '', '', '', '', '', '', '']);
                }
                isFirstRoute = false;

                const routeLabel = 'FF-' + String(routeNumber).padStart(3, '0');

                // Collect unique delivery points and route data
                const uniquePoints = new Set();
                const routeCountries = new Set();
                let seq = 1;
                let routeActualVolume = 0;
                let lastStepDist = 0;

                for (const step of jobSteps) {
                    const jobInfo = jobOrderMap[step.id] || jobOrderMap[step.job] || {};
                    const distKm = step.distance !== undefined ? ((step.distance / 1000) + 14).toFixed(1) : '14.0';
                    const distVal = parseFloat(distKm);

                    // Track the last job step distance (depot to last point)
                    if (distVal > lastStepDist) lastStepDist = distVal;

                    sheet1Data.push([
                        routeLabel,
                        seq,
                        jobInfo.orderNum || '',
                        jobInfo.product || '',
                        jobInfo.volume || 0,
                        jobInfo.country || '',
                        jobInfo.postal || '',
                        jobInfo.city || '',
                        jobInfo.street || '',
                        distVal
                    ]);

                    routeActualVolume += (jobInfo.volume || 0);

                    // Unique point key: country|postal|city|street
                    const pointKey = [jobInfo.country, jobInfo.postal, jobInfo.city, jobInfo.street]
                        .map(s => (s || '').toLowerCase()).join('|');
                    uniquePoints.add(pointKey);

                    if (jobInfo.country) routeCountries.add(jobInfo.country);
                    seq++;
                }

                // Mileage = distance to last delivery point (not round-trip)
                const routeDistKm = lastStepDist;
                grandTotalKm += routeDistKm;

                sheet2Data.push([
                    routeLabel,
                    Math.round(routeActualVolume * 100) / 100,
                    Array.from(routeCountries).join(', '),
                    uniquePoints.size,
                    routeDistKm
                ]);

                routeNumber++;
            }

            // Add ЗАГАЛЬНИЙ КІЛОМЕТРАЖ row at the end of sheet 2
            sheet2Data.push(['', '', '', '', '']);
            sheet2Data.push([te('grand_total_km'), '', '', '', Math.round(grandTotalKm * 10) / 10]);

            // Create workbook
            const ws1 = XLSX.utils.aoa_to_sheet(sheet1Data);
            const ws2 = XLSX.utils.aoa_to_sheet(sheet2Data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws1, te('sheet_routes'));
            XLSX.utils.book_append_sheet(wb, ws2, te('sheet_summary'));
            routesWorkbook = wb;

            // Generate filename
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const yyyy = now.getFullYear();
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            routesFileName = `${te('file_routes')}_${mm}-${dd}-${yyyy}_${hh}_${min}.xlsx`;

            // Show result
            const activeRouteCount = routeNumber - 1;
            document.getElementById('statRoutes').textContent = activeRouteCount;
            document.getElementById('statUnassigned').textContent = unassigned.length;

            let statusMsg = t('routes_built', activeRouteCount);
            if (unassigned.length > 0) {
                statusMsg += t('unassigned_msg', unassigned.length);
            }
            document.getElementById('routeResultStatus').textContent = statusMsg;

            document.getElementById('routeProgressBar').style.width = '100%';
            showSection('sectionRouteResult');
        }

        // --- Polyline decoder (Google/OSRM encoded polyline format) ---
        function decodePolyline(encoded) {
            const points = [];
            let index = 0, lat = 0, lng = 0;
            while (index < encoded.length) {
                let b, shift = 0, result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lat += (result & 1) ? ~(result >> 1) : (result >> 1);
                shift = 0; result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lng += (result & 1) ? ~(result >> 1) : (result >> 1);
                points.push([lat / 1e5, lng / 1e5]);
            }
            return points;
        }

                const idx = parseInt(selection);

            }

            let totalKm = 0, totalStops = 0;
            routesToShow.forEach(route => {
                const color = ROUTE_COLORS[route.colorIdx % ROUTE_COLORS.length];
                const lastStop = route.stops[route.stops.length - 1];
                totalKm += lastStop ? lastStop.distKm : 0;
                totalStops += route.stops.length;

                // Route header in sidebar
                if (selection === 'all') {

                    stopsList.appendChild(hdr);

                route.stops.forEach(stop => {
                    if (stop.lon == null || stop.lat == null) return;

                    // Create numbered marker

                        html: `<div style="width:22px;height:22px;background:${color};border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.3);">${stop.seq}</div>`,
                        iconSize: [22, 22], iconAnchor: [11, 11]
                    });

                    const popupContent = `<div style="font-family:sans-serif;font-size:12px;"><b>${t('point_label', route.label, stop.seq)}</b><br>${stop.city}, ${stop.street}<br><b>${t('order_lbl')}:</b> ${stop.orderNum}<br><b>${t('unload_lbl')}:</b> ${stop.volume} m³<br><b>${t('remain_lbl')}:</b> ${stop.remaining} m³<br><b>${t('km_from_depot')}:</b> ${stop.distKm}</div>`;

                    const marker = L.marker(latLng, { icon: markerIcon })
                        .bindPopup(popupContent)
                        .addTo(leafletMap);
                    mapMarkers.push(marker);

                    // Sidebar stop item
                    const el = document.createElement('div');
                    el.className = 'stop-item';
                    el.innerHTML = `<div style="display:flex;align-items:flex-start;"><span class="stop-num" style="background:${color};">${stop.seq}</span><div><div class="stop-title">${stop.city}, ${stop.street}</div><div class="stop-details">${stop.orderNum} — ${stop.product}<br>${t('unload_lbl')}: <span>${stop.volume} m³</span> | ${t('remain_lbl')}: <span>${stop.remaining} m³</span> | ${t('km_short')}: <span>${stop.distKm}</span></div></div></div>`;

                // Draw polyline from VROOM geometry (actual roads) or fallback to straight lines

        function base64ToBytes(b64) {
            const bin = atob(b64);
            const len = bin.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

                'Формування числового ряду...',
                'Ініціалізація геоматриці...',
                'Завантаження моделі другого порядку...',
                'Рекурсивна обробка матриці відстаней...',
                'Регресія полігонів доставки...',
                'Запуск ядра планувальника...',
                'Оптимізація послідовності вивантажень...',
                'Кластеризація маршрутних полігонів...',
                'Фінальна верифікація результатів...'
            ];
            const STAGES_EN = [
                'Normalizing input data...',
                'Building numerical series...',
                'Initializing geo matrix...',
                'Loading second-order model...',
                'Recursive processing of distance matrix...',
                'Delivery polygon regression...',
                'Starting planner core...',
                'Optimizing unloading sequence...',
                'Clustering route polygons...',
                'Final result verification...'
            ];
            const stages = currentLang === 'en' ? STAGES_EN : STAGES_UK;

            const start = Date.now();
            await new Promise(resolve => {
                const timer = setInterval(() => {
                    const elapsed = Date.now() - start;
                    const pct = Math.min(100, (elapsed / DURATION_MS) * 100);
                    progressBar.style.width = pct + '%';
                    const stageIdx = Math.min(stages.length - 1, Math.floor((elapsed / DURATION_MS) * stages.length));
                    progressText.textContent = stages[stageIdx];
                    if (elapsed >= DURATION_MS) {
                        clearInterval(timer);
                        resolve();
                    }
                }, TICK);
            });

            if (cachedResponse && cachedResponse.mapRoutesData) {
                mapRoutesData = cachedResponse.mapRoutesData;
                const routesCount = cachedResponse.routesCount != null ? cachedResponse.routesCount : mapRoutesData.length;
                const unassigned = cachedResponse.unassigned != null ? cachedResponse.unassigned : 0;
                document.getElementById('statRoutes').textContent = routesCount;
                document.getElementById('statUnassigned').textContent = unassigned;
                let msg = t('routes_built', routesCount);
                if (unassigned > 0) msg += t('unassigned_msg', unassigned);
                document.getElementById('routeResultStatus').textContent = msg;
                // Build routes workbook if cached one is provided as base64 (optional)
                routesWorkbook = null;
                if (cachedResponse.routesXlsxBase64) {
                    try {
                        routesWorkbook = XLSX.read(base64ToBytes(cachedResponse.routesXlsxBase64), { type: 'array' });
                        routesFileName = cachedResponse.routesFileName || (te('file_routes') + '.xlsx');
                    } catch (e) { /* ignore */ }
                }
                showSection('sectionRouteResult');
            } else {
                document.getElementById('routeProcessingStatus').textContent = t('cache_missing');
                document.getElementById('routeProcessingStatus').className = 'status-text error';
            }
        }

        async function generateCachedResponse() {
            if (!ordersData) return;
            // Inject dev API key into the regular input that startGeocoding reads
            const devKeyEl = document.getElementById('devApiKeyInput');
            let devKey = devKeyEl ? devKeyEl.value.trim() : '';
            if (!devKey) {
                devKey = prompt('Geocoding API key (optional, leave empty to skip):') || '';
            }
            document.getElementById('apiKeyInput').value = devKey;

            // Run real geocoding pipeline
            await startGeocoding();
            // After geocoding completes, run real route generation
            await startRouteGeneration();

            // mapRoutesData is now populated by buildRoutesResult
            if (!mapRoutesData) {
                alert('Route generation failed — no cached response to save.');
                return;
            }

            const unassigned = parseInt(document.getElementById('statUnassigned').textContent, 10) || 0;
            const routesCount = parseInt(document.getElementById('statRoutes').textContent, 10) || mapRoutesData.length;

            // Optionally embed routes xlsx as base64 for direct re-download in demo
            let routesXlsxBase64 = null;
            if (routesWorkbook) {
                try {
                    const wbout = XLSX.write(routesWorkbook, { type: 'array', bookType: 'xlsx' });
                    let bin = '';
                    const bytes = new Uint8Array(wbout);
                    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
                    routesXlsxBase64 = btoa(bin);
                } catch (e) { /* ignore */ }
            }

            const payload = {
                generatedAt: new Date().toISOString(),
                routesCount, unassigned,
                mapRoutesData,
                routesXlsxBase64,
                routesFileName
            };

            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cached_response.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            try { localStorage.setItem('vzhyk_demo_cached_response', JSON.stringify(payload)); } catch (_) {}
            alert(t('cache_saved'));
        }

        // Enable demo + dev buttons when an orders file is loaded
        document.getElementById('fileInput').addEventListener('change', function() {
            // Defer so existing handler (which sets ordersData) runs first
            setTimeout(() => {
                if (ordersData) {
                    document.getElementById('btnDemoStart').disabled = false;
                    document.getElementById('btnGenerateCache').disabled = false;
                }
            }, 100);
        });

        // --- Init ---
        window.onload = function() {
            applyStaticTranslations();

            // Background map (non-interactive, desaturated)
            const bgMap = L.map('bgMap', {
                zoomControl: false, attributionControl: false,
                dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
                touchZoom: false, keyboard: false, boxZoom: false
            }).setView([49.5, 18], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(bgMap);

            loadEmbeddedDictionary();
            tryLoadCachedResponse();
        };
    </script>
