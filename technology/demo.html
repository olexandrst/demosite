<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Автоматизація Технологій — Прототип v0.8.46</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Language Switcher -->
        <div class="lang-switcher" role="group" aria-label="Language">
            <button type="button" class="lang-switcher__btn" data-lang="uk" aria-pressed="true">
                <span class="lang-switcher__flag" aria-hidden="true">🇺🇦</span>
                <span class="lang-switcher__code">UA</span>
            </button>
            <button type="button" class="lang-switcher__btn" data-lang="en" aria-pressed="false">
                <span class="lang-switcher__flag" aria-hidden="true">🇬🇧</span>
                <span class="lang-switcher__code">EN</span>
            </button>
            <span class="lang-switcher__pill" aria-hidden="true"></span>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 class="header__title">
                <svg class="header__icon" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="18" cy="18" r="16" fill="none" stroke="#cc0000" stroke-width="2.5"/>
                    <path d="M10 18 L18 10 L26 18 L18 26 Z" fill="#cc0000" opacity="0.85"/>
                    <circle cx="18" cy="18" r="4.5" fill="#fff"/>
                    <circle cx="18" cy="18" r="2" fill="#cc0000"/>
                </svg>
                <span><span class="header__title--red" data-i18n="brand1">Автоматизація</span> <span class="header__title--dark" data-i18n="brand2">Технологій</span></span>
            </h1>
            <p class="header__version" data-i18n="version">Прототип. Версія 0.8.46</p>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- API Key Section -->
            <section class="card">
                <h2 class="card__title">
                    <span class="card__step">1</span>
                    <span data-i18n="step1">Ключ API</span>
                </h2>
                <div class="input-group">
                    <div class="input-with-toggle">
                        <input type="password" id="apiKey" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Введіть ваш API ключ..." autocomplete="off">
                        <button type="button" id="toggleApiKey" class="btn-icon" data-i18n-title="toggleKeyTitle" title="Показати/приховати ключ">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- File Upload Section -->
            <section class="card">
                <h2 class="card__title">
                    <span class="card__step">2</span>
                    <span data-i18n="step2">Завантаження креслення</span>
                </h2>
                <div class="uploads uploads--single">
                    <!-- Drawing Upload -->
                    <div class="upload-zone" id="drawingZone">
                        <input type="file" id="drawingFile" accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif" hidden>
                        <div class="upload-zone__content">
                            <svg class="upload-zone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <p class="upload-zone__label" data-i18n="drawing">Креслення</p>
                            <p class="upload-zone__hint">PDF, JPG, PNG, TIFF</p>
                            <p class="upload-zone__filename" id="drawingName"></p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Action Section -->
            <section class="card">
                <h2 class="card__title">
                    <span class="card__step">3</span>
                    <span data-i18n="step3">Обробка</span>
                </h2>
                <button id="processBtn" class="btn btn--primary" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span data-i18n="processBtn">Запустити обробку</span>
                </button>

                <!-- Progress Bar -->
                <div class="progress" id="progressSection" hidden>
                    <div class="progress__track">
                        <div class="progress__fill" id="progressFill"></div>
                    </div>
                    <div class="progress__info">
                        <span id="progressText" data-i18n="processing">Обробка...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                </div>

                <!-- Result Actions -->
                <div class="result-actions" id="resultActions" hidden>
                    <div class="result-actions__status">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <span data-i18n="resultReady">Результат готовий</span>
                    </div>
                    <div class="result-actions__buttons">
                        <button class="btn btn--secondary" id="previewBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <span data-i18n="preview">Переглянути</span>
                        </button>
                        <button class="btn btn--primary" id="downloadBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span data-i18n="download">Завантажити</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast -->
        <div class="toast" id="toast" hidden>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script src="prompt.uk.js"></script>
    <script src="prompt.en.js"></script>
    <script src="app.js"></script>
</body>
</html>
